version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      main-dependencies:
        applies-to: version-updates
        dependency-type: production
      dev-dependencies:
        applies-to: version-updates
        dependency-type: development
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
