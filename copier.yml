_min_copier_version: "9.6.0"  # first release with `_copier_operation`
_subdirectory: template
_answers_file: .copier-answers.yml

# The README diverges per project immediately, so updates must not overwrite it.
_skip_if_exists:
  - README.md

_tasks:
  - command: git init
    when: "{{ _copier_operation == 'copy' }}"
  - poetry env use {{ python_version }}
  - poetry install

_message_after_copy: |
  Project {{ project_name }} is ready.
  {%- if project_type == 'lib' and codecov %}

  Add the CODECOV_TOKEN secret (from https://app.codecov.io/gh/{{ github_repository }}) for CI coverage uploads:
  https://github.com/{{ github_repository }}/settings/secrets/actions
  {%- endif %}

github_url:
  type: str
  help: GitHub repository link (https://github.com/owner/name)
  validator: >-
    {% if not (github_url | regex_search('^https://github\\.com/[A-Za-z0-9-]+/[A-Za-z0-9._-]+?(\\.git)?/?$')) %}
    Use the https://github.com/owner/name form.
    {% endif %}

github_repository:
  type: str
  default: "{{ github_url | regex_replace('^https://github\\.com/', '') | regex_replace('/$', '') | regex_replace('\\.git$', '') }}"
  when: false

project_type:
  type: str
  help: App (not a package) or lib (typed PyPI package tested across Python versions)?
  choices:
    - app
    - lib
  default: app

project_name:
  type: str
  help: Project name (directory and PyCharm module name)
  default: "{{ github_repository.split('/')[1] | lower | replace('.', '-') }}"
  validator: >-
    {% if not (project_name | regex_search('^[a-z0-9][a-z0-9_-]*$')) %}
    Use lowercase letters, digits, "-" and "_", starting with a letter or digit.
    {% endif %}

package_name:
  type: str
  default: "{{ project_name | replace('-', '_') }}"
  when: false

description:
  type: str
  help: One-line project description
  default: ""

author_name:
  type: str
  help: Author name

author_email:
  type: str
  help: Author email

idea_enabled:
  type: bool
  help: Include PyCharm project files (.idea module, run configurations, file watchers)?
  default: yes

# Asked (not computed) so the year is recorded in the answers file and stays fixed across updates.
copyright_year:
  type: str
  help: Copyright year
  default: "{{ '%Y' | strftime }}"

# Raising the newest version here is how libs start testing a new Python release.
known_python_versions:
  type: yaml
  default: ["3.10", "3.11", "3.12", "3.13", "3.14"]
  when: false

py_typed_enabled:
  type: bool
  default: '{{ project_type == "lib" }}'
  when: false

python_version:
  type: str
  help: "{{ 'Minimum supported Python version' if project_type == 'lib' else 'Python version' }}"
  choices: "{{ known_python_versions | to_yaml }}"
  default: "{{ known_python_versions[0] if project_type == 'lib' else known_python_versions[-1] }}"

supported_python_versions:
  type: yaml
  default: "{{ known_python_versions[known_python_versions.index(python_version):] | to_json }}"
  when: false

nox_enabled:
  type: bool
  default: '{{ project_type == "lib" }}'
  when: false

license:
  type: str
  help: License
  choices:
    - MIT
    - Apache-2.0
    - Proprietary
  default: MIT

github_actions_enabled:
  type: bool
  default: '{{ project_type == "lib" }}'
  when: false

codecov:
  type: bool
  help: Upload coverage to Codecov from CI? (needs a CODECOV_TOKEN repository secret)
  when: "{{ project_type == 'lib' }}"
  default: false
